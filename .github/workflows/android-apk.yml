name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache release keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/ua-light-alert-release.jks
          key: ua-light-alert-release-keystore-v1

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist-apk ~/.android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          else
            KS_FILE="$HOME/.android/ua-light-alert-release.jks"
            if [ ! -f "$KS_FILE" ]; then
              keytool -genkeypair -v -keystore "$KS_FILE" -alias uaserver \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass uaLightAlert2026 -keypass uaLightAlert2026 \
                -dname "CN=UA Light Alert, OU=Mobile, O=UAServer, L=Kyiv, C=UA"
            fi
            export ANDROID_KEYSTORE_PATH="$KS_FILE"
            export ANDROID_KEYSTORE_PASSWORD="uaLightAlert2026"
            export ANDROID_KEY_ALIAS="uaserver"
            export ANDROID_KEY_PASSWORD="uaLightAlert2026"
          fi
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/ua-light-alert.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ua-light-alert-apk
          path: dist-apk/ua-light-alert.apk
          retention-days: 90
