name: Publish plugin release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect plugin version change
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*Version: *\([0-9][0-9.]*\).*/\1/p' ua-light-alert.php | head -n1)"
          PREVIOUS_VERSION="$(git show HEAD^:ua-light-alert.php 2>/dev/null | sed -n 's/.*Version: *\([0-9][0-9.]*\).*/\1/p' | head -n1 || true)"
          if [ -z "$VERSION" ]; then
            echo "Could not read plugin version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ANDROID_CHANGED="$(git diff --name-only HEAD^ HEAD 2>/dev/null | grep -E '^(android/|\.github/workflows/release\.yml$)' || true)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$VERSION" != "$PREVIOUS_VERSION" ] || [ -n "$ANDROID_CHANGED" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable plugin ZIP
        if: steps.version.outputs.publish == 'true'
        run: |
          mkdir -p dist/ua-light-alert
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='tests' --exclude='android' ./ dist/ua-light-alert/
          cd dist
          zip -qr "ua-light-alert-${{ steps.version.outputs.version }}.zip" ua-light-alert

      - name: Set up JDK 17
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK 35
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache release keystore
        if: steps.version.outputs.publish == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/ua-light-alert-release.jks
          key: ua-light-alert-release-keystore-v1

      - name: Set up Gradle 8.9
        if: steps.version.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed Release APK
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist ~/.android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          else
            KS_FILE="$HOME/.android/ua-light-alert-release.jks"
            if [ ! -f "$KS_FILE" ]; then
              keytool -genkeypair -v -keystore "$KS_FILE" -alias uaserver \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass uaLightAlert2026 -keypass uaLightAlert2026 \
                -dname "CN=UA Light Alert, OU=Mobile, O=UAServer, L=Kyiv, C=UA"
            fi
            export ANDROID_KEYSTORE_PATH="$KS_FILE"
            export ANDROID_KEYSTORE_PASSWORD="uaLightAlert2026"
            export ANDROID_KEY_ALIAS="uaserver"
            export ANDROID_KEY_PASSWORD="uaLightAlert2026"
          fi
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk dist/ua-light-alert.apk

      - name: Publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: UA Light Alert ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/ua-light-alert-${{ steps.version.outputs.version }}.zip
            dist/ua-light-alert.apk
