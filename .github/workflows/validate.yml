name: Validate UA Light Alert

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Service worker JavaScript syntax check
        run: node --check assets/ua-light-alert-sw.js

      - name: Build installable plugin ZIP
        run: |
          mkdir -p dist/ua-light-alert
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/ua-light-alert/
          cd dist
          zip -qr ua-light-alert-4.3.0.zip ua-light-alert
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ua-light-alert-4.3.0-installable
          path: dist/ua-light-alert-4.3.0.zip
          if-no-files-found: error
          retention-days: 30
